    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends

    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

        }

    const resourceMap = {};
    for (const entry of extResources) {

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

data-reveal=\"marquee\" class=\"{{ revealClass.marquee }}\" style=\"position:relative; z-index:1; overflow:hidden; background:#ff3fa4; padding:14px 0; margin-top:64px; transform:rotate(-1.2deg); border-top:3px solid #0c0c10; border-bottom:3px solid #0c0c10;\">\n    <div class=\"marquee-track\" style=\"display:flex; width:200%; white-space:nowrap; animation:marquee 22s linear infinite;\">\n      <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:20px; color:#0c0c10; padding-right:40px;\">SHIPS CODE THAT WORKS • FIXES BUGS BEFORE YOU NOTICE THEM • REPLIES FASTER THAN YOUR CURRENT DEV • BUILDS THINGS THAT DON'T FALL OVER • SHIPS CODE THAT WORKS • FIXES BUGS BEFORE YOU NOTICE THEM • REPLIES FASTER THAN YOUR CURRENT DEV • BUILDS THINGS THAT DON'T FALL OVER • <\/span>\n      <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:20px; color:#0c0c10; padding-right:40px;\">SHIPS CODE THAT WORKS • FIXES BUGS BEFORE YOU NOTICE THEM • REPLIES FASTER THAN YOUR CURRENT DEV • BUILDS THINGS THAT DON'T FALL OVER • SHIPS CODE THAT WORKS • FIXES BUGS BEFORE YOU NOTICE THEM • REPLIES FASTER THAN YOUR CURRENT DEV • BUILDS THINGS THAT DON'T FALL OVER • <\/span>\n    <\/div>\n  <\/div>\n\n  <section id=\"about\" data-reveal=\"about\" class=\"about-grid {{ revealClass.about }}\" style=\"position:relative; z-index:1; padding:110px 6%;\">\n    <div class=\"blob\" style=\"width:100%; aspect-ratio:1; background:#7c5cff; display:flex; align-items:center; justify-content:center;\">\n      <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:64px; color:#0c0c10;\">10+<\/span>\n    <\/div>\n    <div>\n      <div style=\"font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#3ffbdc; margin-bottom:16px;\">About<\/div>\n      <p style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(24px,3vw,36px); line-height:1.3; margin:0 0 24px;\">\n        I've spent over a decade in the backend trenches, building software that holds up once real people start using it.\n      <\/p>\n      <p style=\"font-size:15px; line-height:1.9; color:#c9c7c0; margin:0 0 16px; max-width:600px;\">\n        I care about clean APIs, data that doesn't get weird under pressure, and features that work the same at 2pm and 2am. I've touched a bit of everything — backend, frontend, AI features, and the glue that holds a product together.\n      <\/p>\n      <p style=\"font-size:15px; line-height:1.9; color:#c9c7c0; margin:0 0 16px; max-width:600px;\">\n        Multi-tenant SaaS platforms were basically my daily routine — one codebase, many customers, none of them stepping on each other's data.\n      <\/p>\n      <p style=\"font-size:15px; line-height:1.9; color:#c9c7c0; margin:0 0 16px; max-width:600px;\">\n        Also good at the unglamorous stuff: taking an old, dying system and dragging it back to life without breaking everything on the way.\n      <\/p>\n      <p style=\"font-size:15px; line-height:1.9; color:#c9c7c0; margin:0 0 16px; max-width:600px;\">\n        Building something brand new from scratch? Also an option. Hire me and find out — I promise it'll be less painful than your last dev experience.\n      <\/p>\n      <p style=\"font-size:15px; line-height:1.9; color:#c9c7c0; margin:0; max-width:600px;\">\n        I'm just opening up to new work, so my client list is short. My commit history isn't.\n      <\/p>\n    <\/div>\n  <\/section>\n\n  <section id=\"skills\" data-reveal=\"skills\" class=\"{{ revealClass.skills }}\" style=\"position:relative; z-index:1; padding:60px 6% 110px;\">\n    <div style=\"font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#3ffbdc; margin-bottom:16px;\">Skills<\/div>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:clamp(30px,4vw,52px); margin:0 0 40px; letter-spacing:-1px;\">Stack &amp; tools<\/h2>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:40px 20px; justify-items:center;\">\n      <sc-for list=\"{{ skillGroups }}\" as=\"group\" hint-placeholder-count=\"5\">\n        <div style=\"text-align:center;\">\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:#78766e; text-transform:uppercase; letter-spacing:1px; margin-bottom:16px;\">{{ group.label }}<\/div>\n          <div style=\"display:flex; flex-wrap:wrap; justify-content:center; gap:10px; max-width:420px; margin:0 auto;\">\n            <sc-for list=\"{{ group.items }}\" as=\"skill\" hint-placeholder-count=\"6\">\n              <span class=\"chip\" style=\"background:{{ skill.bg }}; color:#0c0c10; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; padding:9px 16px; border-radius:999px; animation-delay:{{ skill.delay }};\">{{ skill.name }}<\/span>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n\n  <section id=\"work\" data-reveal=\"work\" class=\"{{ revealClass.work }}\" style=\"position:relative; z-index:1; padding:80px 6% 100px; background:#131318; border-top:2px solid #1e1e24; border-bottom:2px solid #1e1e24; text-align:center;\">\n    <div class=\"construction-strip\"><\/div>\n    <div style=\"font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#ff3fa4; margin-bottom:16px; margin-top:16px;\">Portfolio<\/div>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:clamp(28px,3.6vw,46px); margin:0 auto 20px; letter-spacing:-1px; max-width:700px;\">This section is under construction. New to freelancing, not new to shipping code.<span class=\"blink\">_<\/span><\/h2>\n    <p style=\"font-size:15px; line-height:1.9; color:#c9c7c0; max-width:520px; margin:0 auto;\">\n      10+ years writing production code for employers, zero freelance case studies — yet. You'd be my first freelance client, not my first rodeo.\n    <\/p>\n    <div style=\"margin-top:40px; max-width:560px; margin-left:auto; margin-right:auto;\">\n      <div style=\"font-size:13px; color:#78766e; margin-bottom:14px;\">Bored? Play this while you wait.<\/div>\n      <div id=\"bug-squash\" style=\"position:relative; height:260px; background:#0c0c10; border:1px solid #2c2c34; border-radius:16px; overflow:hidden; cursor:crosshair;\">\n        <div style=\"position:absolute; top:14px; left:18px; right:18px; display:flex; justify-content:space-between; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:#c9c7c0; z-index:2; pointer-events:none;\">\n          <span>Score: <span id=\"bug-squash-score\">0<\/span><\/span>\n          <span id=\"bug-squash-time\">30s<\/span>\n        <\/div>\n        <button id=\"bug-squash-start\" type=\"button\" style=\"position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); padding:14px 26px; background:#3ffbdc; color:#0c0c10; border:none; border-radius:12px; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:15px; cursor:pointer; z-index:3;\">▶ Squash bugs<\/button>\n      <\/div>\n      <div style=\"font-size:12px; color:#78766e; margin-top:10px;\">30 seconds. Click the bugs before they scurry off.<\/div>\n    <\/div>\n    <div class=\"construction-strip\" style=\"margin-top:32px;\"><\/div>\n  <\/section>\n\n  <section id=\"contact\" data-reveal=\"contact\" class=\"{{ revealClass.contact }}\" style=\"position:relative; z-index:1; padding:120px 6%; text-align:center;\">\n    <div style=\"font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#3ffbdc; margin-bottom:20px;\">Get in touch<\/div>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:clamp(34px,6vw,72px); margin:0 0 36px; letter-spacing:-1.5px;\">Let's build<br>something <span style=\"color:#ff3fa4;\">good<\/span>.<\/h2>\n    <a href=\"https://www.linkedin.com/in/paras-bisht-467762337/\" target=\"_blank\" rel=\"noopener\" class=\"lift-btn\" style=\"display:inline-block; text-decoration:none; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:clamp(20px,3.2vw,36px); color:#ffd23f; border-bottom:4px solid #ffd23f; padding-bottom:6px; margin-bottom:24px;\">Connect on LinkedIn <span class=\"arrow-slide\">→<\/span><\/a>\n    <div style=\"font-size:15px; color:#c9c7c0;\">Open to remote<\/div>\n  <\/section>\n\n  <footer style=\"position:relative; z-index:1; padding:28px 6%; border-top:2px solid #1e1e24; display:flex; justify-content:space-between; font-size:12px; color:#78766e;\">\n    <span>© 2026 Paras Bisht<\/span>\n    <span>Built to get hired<\/span>\n  <\/footer>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { revealed: {} };\n\n  componentDidMount() {\n    this.observer = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (entry.isIntersecting) {\n          const key = entry.target.getAttribute('data-reveal');\n          if (key && !this.state.revealed[key]) {\n            this.setState((s) => ({ revealed: { ...s.revealed, [key]: true } }));\n          }\n        }\n      });\n    }, { threshold: 0.05, rootMargin: '0px 0px -5% 0px' });\n    document.querySelectorAll('[data-reveal]').forEach((el) => this.observer.observe(el));\n    this.initBugSquash();\n  }\n\n  componentWillUnmount() {\n    if (this.observer) this.observer.disconnect();\n    if (this.bugSquashTimers) this.bugSquashTimers.forEach((t) => clearInterval(t));\n  }\n\n  initBugSquash() {\n    const root = document.getElementById('bug-squash');\n    const scoreEl = document.getElementById('bug-squash-score');\n    const timeEl = document.getElementById('bug-squash-time');\n    const startBtn = document.getElementById('bug-squash-start');\n    if (!root || !scoreEl || !timeEl || !startBtn) return;\n\n    let score = 0;\n    let bugs = [];\n    this.bugSquashTimers = [];\n\n    const clearBugs = () => {\n      bugs.forEach((b) => b.remove());\n      bugs = [];\n    };\n\n    const spawnSplat = (leftPct, topPct) => {\n      const splat = document.createElement('div');\n      const wobble = -20 + Math.random() * 40;\n      splat.style.cssText = `position:absolute; left:${leftPct}%; top:${topPct}%; width:36px; height:36px; background:radial-gradient(circle at 35% 30%, #a6ff6e, #4d8a1f 70%); border-radius:42% 58% 63% 37% / 41% 44% 56% 59%; opacity:0; transform:translate(-50%,-50%) scale(0.2) rotate(${wobble}deg); transition:transform 0.25s cubic-bezier(.2,.8,.2,1), opacity 0.25s ease; pointer-events:none; z-index:0;`;\n      root.appendChild(splat);\n      requestAnimationFrame(() => {\n        splat.style.opacity = '0.9';\n        splat.style.transform = `translate(-50%,-50%) scale(1) rotate(${wobble}deg)`;\n      });\n      setTimeout(() => { splat.style.transition = 'opacity 0.5s ease'; splat.style.opacity = '0'; }, 400);\n      setTimeout(() => splat.remove(), 900);\n    };\n\n    const spawnBug = () => {\n      const bug = document.createElement('button');\n      bug.type = 'button';\n      bug.textContent = '🐛';\n      bug.setAttribute('aria-label', 'Squash bug');\n      const size = 24 + Math.random() * 16;\n      const leftPct = 5 + Math.random() * 80;\n      const topPct = 30 + Math.random() * 55;\n      bug.style.cssText = `position:absolute; left:${leftPct}%; top:${topPct}%; font-size:${size}px; background:none; border:none; padding:0; line-height:1; cursor:pointer; z-index:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4)); opacity:0; transform:translate(-50%,-50%) scale(0.4); transition:transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s ease;`;\n      root.appendChild(bug);\n      bugs.push(bug);\n      requestAnimationFrame(() => {\n        bug.style.opacity = '1';\n        bug.style.transform = 'translate(-50%,-50%) scale(1)';\n      });\n\n      const remove = (squashed) => {\n        bug.style.pointerEvents = 'none';\n        bug.style.transition = 'transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s ease';\n        bug.style.transform = squashed ? 'translate(-50%,-50%) scale(1.5, 0.15)' : 'translate(-50%,-50%) scale(0.5)';\n        bug.style.opacity = '0';\n        if (squashed) spawnSplat(leftPct, topPct);\n        setTimeout(() => {\n          bug.remove();\n          bugs = bugs.filter((b) => b !== bug);\n        }, 280);\n      };\n\n      const timeout = setTimeout(() => remove(false), 2200);\n      bug.addEventListener('click', () => {\n        score += 1;\n        scoreEl.textContent = String(score);\n        clearTimeout(timeout);\n        remove(true);\n      });\n    };\n\n    const endGame = () => {\n      this.bugSquashTimers.forEach((t) => clearInterval(t));\n      this.bugSquashTimers = [];\n      clearBugs();\n      startBtn.textContent = `▶ Play again (scored ${score})`;\n      startBtn.style.display = 'block';\n    };\n\n    startBtn.addEventListener('click', () => {\n      score = 0;\n      let timeLeft = 30;\n      scoreEl.textContent = '0';\n      timeEl.textContent = '30s';\n      startBtn.style.display = 'none';\n      clearBugs();\n      const spawnTimer = setInterval(spawnBug, 900);\n      const countdownTimer = setInterval(() => {\n        timeLeft -= 1;\n        timeEl.textContent = `${timeLeft}s`;\n        if (timeLeft <= 0) endGame();\n      }, 1000);\n      this.bugSquashTimers = [spawnTimer, countdownTimer];\n    });\n  }\n\n  renderVals() {\n    const keys = ['hero', 'marquee', 'about', 'skills', 'work', 'contact'];\n    const revealClass = {};\n    keys.forEach((k) => { revealClass[k] = this.state.revealed[k] ? 'revealed' : ''; });\n    const rawGroups = [\n      { label: 'Languages & PHP Frameworks', icon: '{ }', items: [\n        { name: 'PHP', bg: '#3ffbdc' }, { name: 'Laravel', bg: '#ff3fa4' }, { name: 'CakePHP', bg: '#ffd23f' }, { name: 'CodeIgniter', bg: '#7c5cff' }, { name: 'Yii', bg: '#3ffbdc' }, { name: 'Laminas', bg: '#ff3fa4' }, { name: 'Slim', bg: '#ffd23f' }, { name: 'JavaScript', bg: '#7c5cff' },\n      ]},\n      { label: 'Frontend', icon: '<\/>', items: [\n        { name: 'HTML', bg: '#ffd23f' }, { name: 'Vue', bg: '#ff3fa4' }, { name: 'React', bg: '#3ffbdc' }, { name: 'Backbone.js', bg: '#7c5cff' }, { name: 'jQuery', bg: '#ffd23f' }, { name: 'Ajax', bg: '#ff3fa4' }, { name: 'Tailwind', bg: '#3ffbdc' }, { name: 'Bootstrap', bg: '#7c5cff' },\n      ]},\n      { label: 'Data & Infra', icon: 'DB', items: [\n        { name: 'MySQL', bg: '#3ffbdc' }, { name: 'PostgreSQL', bg: '#ff3fa4' }, { name: 'MongoDB', bg: '#ffd23f' }, { name: 'AWS S3/Lambda', bg: '#7c5cff' }, { name: 'AWS EC2', bg: '#3ffbdc' }, { name: 'AWS RDS', bg: '#ff3fa4' }, { name: 'DigitalOcean', bg: '#ffd23f' }, { name: 'Google Cloud', bg: '#7c5cff' }, { name: 'Docker', bg: '#3ffbdc' }, { name: 'Memcached', bg: '#ff3fa4' }, { name: 'Redis', bg: '#ffd23f' }, { name: 'Nginx', bg: '#7c5cff' }, { name: 'Linux', bg: '#3ffbdc' }, { name: 'CI/CD', bg: '#ff3fa4' }, { name: 'Elasticsearch', bg: '#ffd23f' }, { name: 'RabbitMQ', bg: '#7c5cff' }, { name: 'Git', bg: '#3ffbdc' },\n      ]},\n      { label: 'Auth & APIs', icon: 'API', items: [\n        { name: 'REST APIs', bg: '#ffd23f' }, { name: 'GraphQL', bg: '#ff3fa4' }, { name: 'gRPC', bg: '#3ffbdc' }, { name: 'Webhooks', bg: '#7c5cff' }, { name: 'OAuth2', bg: '#ffd23f' }, { name: 'JWT', bg: '#ff3fa4' }, { name: 'SAML SSO', bg: '#3ffbdc' }, { name: 'Payment gateways', bg: '#7c5cff' }, { name: 'Stripe', bg: '#ffd23f' }, { name: 'PayPal', bg: '#ff3fa4' },\n      ]},\n      { label: 'AI / LLM', icon: 'AI', items: [\n        { name: 'LLM integration', bg: '#ff3fa4' }, { name: 'AI chatbots', bg: '#3ffbdc' }, { name: 'OpenAI API', bg: '#ffd23f' }, { name: 'Prompt engineering', bg: '#7c5cff' }, { name: 'RAG / vector search', bg: '#3ffbdc' },\n      ]},\n      { label: 'No-code / Low-code', icon: 'NC', items: [\n        { name: 'Bubble.io', bg: '#ffd23f' }, { name: 'Zapier', bg: '#ff3fa4' }, { name: 'Make (Integromat)', bg: '#3ffbdc' },\n      ]},\n      { label: 'Testing & Quality', icon: 'QA', items: [\n        { name: 'PHPUnit', bg: '#7c5cff' }, { name: 'Jest', bg: '#ffd23f' }, { name: 'Postman', bg: '#ff3fa4' },\n      ]},\n    ];\n    const skillGroups = rawGroups.map((g) => {\n      const longest = Math.max(...g.items.map((it) => it.name.length));\n      const radius = Math.min(100, Math.max(65, g.items.length * 9 + longest * 1.3));\n      return {\n        ...g,\n        radius,\n        wheelSize: radius * 2 + 60,\n        items: g.items.map((it, i) => ({\n          ...it,\n          angle: Math.round((360 / g.items.length) * i),\n          delay: `${(i * 0.07).toFixed(2)}s`,\n        })),\n      };\n    });\n    return { revealClass, skillGroups };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
  </script>
